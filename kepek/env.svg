<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Projektmappa és a .env fájl helye">
  <rect width="720" height="300" rx="14" fill="#0b1426"/>
  <g font-family="ui-monospace,monospace" font-size="14" fill="#b7c8e1">
    <text x="28" y="46" fill="#55def1">projekt/</text>
    <text x="52" y="76">├── index.js</text>
    <text x="52" y="104">├── package.json</text>
    <text x="52" y="132">├── .gitignore</text>
    <text x="52" y="160" fill="#64e2a3">├── .env</text>
    <text x="52" y="188" fill="#a3b9da">└── .env.example</text>
  </g>
  <g font-family="ui-monospace,monospace" font-size="13">
    <rect x="380" y="112" width="312" height="150" rx="10" fill="#111a2e" stroke="#315b6d"/>
    <text x="398" y="140" fill="#64e2a3">PORT=3000</text>
    <text x="398" y="166" fill="#64e2a3">API_KULCS=itt-egy-hosszu-titok</text>
    <text x="398" y="192" fill="#efcba6">DB_JELSZO=valtoztasd-meg</text>
    <text x="398" y="226" fill="#7f94b2" font-size="11"># kulcs=érték, soronként</text>
  </g>
  <g font-family="Inter,sans-serif" font-size="12" fill="#8299bc">
    <text x="380" y="90">.env — helyi titkok, Gitbe nem kerül</text>
    <text x="52" y="230" fill="#7f94b2">.gitignore:</text>
    <text x="52" y="252" fill="#b7c8e1">node_modules/</text>
    <text x="52" y="272" fill="#64e2a3">.env</text>
  </g>
</svg>
