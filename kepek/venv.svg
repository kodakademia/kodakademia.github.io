<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Python virtuális környezet felépítése">
  <rect width="720" height="260" rx="14" fill="#0b1426"/>
  <g font-family="ui-monospace,monospace" font-size="14">
    <text x="30" y="52" fill="#64e2a3">python -m venv .venv</text>
    <text x="30" y="82" fill="#55def1">source .venv/bin/activate</text>
    <text x="30" y="112" fill="#7f94b2"># Windows: .venv\Scripts\activate</text>
    <text x="30" y="146" fill="#64e2a3">pip install requests python-dotenv</text>
    <text x="30" y="180" fill="#55def1">python app.py</text>
    <text x="30" y="214" fill="#efcba6">(.venv) $</text>
  </g>
  <g font-family="Inter,sans-serif" font-size="12" fill="#99aac7">
    <rect x="430" y="44" width="260" height="168" rx="10" fill="#111a2e" stroke="#315b6d"/>
    <text x="448" y="74" fill="#eff4ff" font-size="13">Miért kell?</text>
    <text x="448" y="102">Minden projekt saját csomagokat</text>
    <text x="448" y="124">kap, így nem ütköznek a verziók.</text>
    <text x="448" y="156" fill="#efcba6">A .venv mappát ne tedd Gitbe.</text>
    <text x="448" y="184">Írd fel a csomagokat:</text>
    <text x="448" y="204" fill="#64e2a3" font-family="ui-monospace,monospace" font-size="11">pip freeze &gt; requirements.txt</text>
  </g>
</svg>
